name: publish-short
on:
  schedule:
    - cron: "0 13 * * *"   # 9:00 AM US Eastern (EDT)
    - cron: "0 21 * * *"   # 5:00 PM US Eastern (EDT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the video but do not upload"
        default: "false"
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - run: pip install -q -r requirements.txt
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          PUBLISH_PRIVACY: ${{ vars.PUBLISH_PRIVACY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python -m pipeline.run
      - name: Commit state
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline@users.noreply.github.com"
          git add content/state.json content/calendar.json assets/license_log.csv logs/ || true
          git diff --cached --quiet || git commit -m "pipeline run $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase && git push
      - name: Keep preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-short
          path: work/*.mp4
          if-no-files-found: ignore
          retention-days: 7
