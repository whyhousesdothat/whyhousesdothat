name: weekly-optimize
on:
  schedule:
    - cron: "0 12 * * 1"   # Monday 8 AM ET
  workflow_dispatch:
permissions:
  contents: write
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
        run: python -m pipeline.weekly
      - if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline@users.noreply.github.com"
          git add content/ logs/ || true
          git diff --cached --quiet || git commit -m "weekly optimize $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
